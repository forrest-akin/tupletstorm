[package]
name = "rhythm-tree-wasm"
version = "0.1.0"
description = "Browser bindings for rhythm-tree."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rhythm-tree = { path = "../rhythm-tree" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[lints]
workspace = true
