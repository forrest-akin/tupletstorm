[workspace]
resolver = "2"
members = ["crates/rhythm-tree", "crates/rhythm-tree-wasm"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
